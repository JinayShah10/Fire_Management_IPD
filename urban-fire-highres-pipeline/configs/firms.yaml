  confidence: ["low", "nominal", "high", "l", "n", "h", "u"]
  min_frp: 0.0
cluster_dist_m: 400
persistent_days: 10
s2_prescreen:
  max_scene_cloud: 50
  max_events_per_region_month: 100000
